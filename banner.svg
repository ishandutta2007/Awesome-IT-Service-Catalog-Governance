<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 4s infinite ease-in-out;
    }
    .float-card {
      animation: float 6s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0V320 M200 0V320 M300 0V320 M400 0V320 M500 0V320 M600 0V320 M700 0V320 M800 0V320 M900 0V320 M1000 0V320 M1100 0V320" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Background Dynamic Glowing Nodes -->
  <g opacity="0.25">
    <circle cx="1050" cy="80" r="120" fill="#818cf8" filter="blur(40px)" class="pulse-circle" />
    <circle cx="150" cy="260" r="90" fill="#38bdf8" filter="blur(35px)" class="pulse-circle" />
  </g>

  <!-- Decorative Flow Graphic Elements on Right Side -->
  <g transform="translate(820, 45)" class="float-card" filter="url(#shadow)">
    <!-- Service Catalog Node Card 1 -->
    <rect x="0" y="0" width="310" height="64" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#38bdf8" fill-opacity="0.2" />
    <path d="M28 26L36 34M36 26L28 34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="62" y="34" class="badge-text" font-size="15">AWS Service Catalog</text>
    <text x="62" y="50" font-family="sans-serif" font-size="11" fill="#64748b">Governance &amp; Provisioning</text>

    <!-- Connection Line -->
    <path d="M155 64V86" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Service Catalog Node Card 2 -->
    <rect x="0" y="86" width="310" height="64" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <rect x="16" y="102" width="32" height="32" rx="8" fill="#818cf8" fill-opacity="0.2" />
    <circle cx="32" cy="118" r="6" stroke="#818cf8" stroke-width="2" fill="none" />
    <text x="62" y="120" class="badge-text" font-size="15">iTop &amp; ServiceNow ITSM</text>
    <text x="62" y="136" font-family="sans-serif" font-size="11" fill="#64748b">ITIL CMDB &amp; Request Fulfillment</text>

    <!-- Connection Line -->
    <path d="M155 150V172" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Service Catalog Node Card 3 -->
    <rect x="0" y="172" width="310" height="64" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <rect x="16" y="188" width="32" height="32" rx="8" fill="#c084fc" fill-opacity="0.2" />
    <path d="M26 204H38M32 198V210" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
    <text x="62" y="206" class="badge-text" font-size="15">Backstage &amp; Open-Source</text>
    <text x="62" y="222" font-family="sans-serif" font-size="11" fill="#64748b">Developer Portals &amp; Self-Service</text>
  </g>

  <!-- Left Header Content Area -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" />
    <text x="28" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED IT GOVERNANCE ECOSYSTEM</text>

    <text x="0" y="72" class="title">Awesome IT Service Catalog</text>
    <text x="0" y="116" class="title">&amp; Governance</text>

    <text x="0" y="156" class="subtitle">SaaS Platforms, Open-Source ITSM Suites &amp; Cloud Governance</text>
  </g>
</svg>
